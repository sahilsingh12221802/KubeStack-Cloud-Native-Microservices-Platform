services:
  postgres:
    image: postgres:16
    container_name: kubestack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kubestack
      POSTGRES_USER: kubestack
      POSTGRES_PASSWORD: kubestack_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubestack -d kubestack"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: kubestack-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      - postgres

  node-exporter:
      image: prom/node-exporter:latest
      container_name: kubestack-node-exporter
      restart: unless-stopped
      ports:
        - "9100:9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.2
    container_name: kubestack-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=10s"

  grafana:
    image: grafana/grafana:latest
    container_name: kubestack-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: