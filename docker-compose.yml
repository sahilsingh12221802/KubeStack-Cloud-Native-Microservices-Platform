services:
  postgres:
    image: postgres:16
    container_name: kubestack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kubestack
      POSTGRES_USER: kubestack
      POSTGRES_PASSWORD: kubestack_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubestack -d kubestack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: